[workspace]
resolver = "2"
members = ["lib", "cli"]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Numeric computing — start without BLAS for portability; add blas-src later for perf tuning
ndarray = { version = "0.16", features = ["rayon"] }
ndarray-rand = "0.15"

# Parallelism
rayon = "1.10"

# Image I/O
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Random
rand = "0.8"
rand_distr = "0.4"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Error handling
thiserror = "2"
anyhow = "1"
base64 = "0.22"
